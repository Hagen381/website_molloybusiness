name: Kachelbilder nachladen

# Laedt die vier Angebots-Kachelgrafiken nach, die beim Archivlauf fehlten,
# weil sie im Original nur als Hintergrundbild im externen Elementor-CSS
# standen. Laeuft ausschliesslich auf manuellen Zuruf.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  kachelbilder:
    runs-on: ubuntu-latest

    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhaengigkeiten installieren
        run: pip install pillow

      - name: Kachelgrafiken herunterladen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/assets/images/angebote

          urls=(
            "https://molloybusiness.com/wp-content/uploads/2024/04/PinterestAccountAufbau.png"
            "https://molloybusiness.com/wp-content/uploads/2024/04/PinterestAccountManagement.png"
            "https://molloybusiness.com/wp-content/uploads/2025/11/Pinterest-Strategie-Call.png"
            "https://molloybusiness.com/wp-content/uploads/2025/11/Pinterest-Audit.png"
          )

          for url in "${urls[@]}"; do
            ziel="src/assets/images/angebote/$(basename "$url")"
            echo "Lade $url"
            # --fail laesst curl bei HTTP-Fehlern (404, 403, 5xx) mit Exitcode
            # enden; zusammen mit set -e bricht damit der ganze Job ab.
            curl --fail --silent --show-error --location \
                 --retry 3 --retry-delay 2 \
                 --output "$ziel" "$url"
            if [ ! -s "$ziel" ]; then
              echo "FEHLER: $ziel ist leer." >&2
              exit 1
            fi
          done

      - name: Groesse und Pixelmasse ermitteln
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          from pathlib import Path
          from PIL import Image

          dateien = [
              "PinterestAccountAufbau.png",
              "PinterestAccountManagement.png",
              "Pinterest-Strategie-Call.png",
              "Pinterest-Audit.png",
          ]

          print("## Nachgeladene Kachelgrafiken")
          print()
          print("| Datei | Groesse | Pixelmasse | Format |")
          print("| --- | --- | --- | --- |")

          for name in dateien:
              pfad = Path("src/assets/images/angebote") / name
              # Ein nicht lesbares oder kaputtes Bild loest hier eine Exception
              # aus — der Schritt schlaegt fehl, statt still durchzulaufen.
              with Image.open(pfad) as bild:
                  breite, hoehe = bild.size
                  formt = bild.format
              kb = pfad.stat().st_size / 1024
              print(f"| `{name}` | {kb:.1f} KB | {breite} x {hoehe} px | {formt} |")
          PY

      - name: Ergebnis committen und pushen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/images/angebote
          if git diff --cached --quiet; then
            echo "Keine Aenderungen — kein Commit noetig."
            exit 0
          fi
          git commit -m "Kachelgrafiken der Angebotsseite nachgeladen"
          git push origin HEAD:main
