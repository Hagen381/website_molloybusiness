# Baut die Android-App "Puls-Overlay" (Ordner android-hr-overlay/) als APK.
# Hat nichts mit der Website zu tun; läuft nur, wenn sich die App ändert.
name: Android Puls-Overlay APK

on:
  push:
    paths:
      - "android-hr-overlay/**"
      - ".github/workflows/android-hr-overlay.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-hr-overlay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - run: gradle assembleDebug --no-daemon
      - run: cp app/build/outputs/apk/debug/app-debug.apk Puls-Overlay.apk
      - uses: actions/upload-artifact@v4
        with:
          name: puls-overlay-apk
          path: android-hr-overlay/app/build/outputs/apk/debug/app-debug.apk
      # Öffentlicher Download-Link (auch direkt vom Handy aus)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: puls-overlay-latest
          name: Puls-Overlay (Android)
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: "APK auf dem Handy herunterladen und installieren (Installation aus unbekannten Quellen erlauben)."
          files: android-hr-overlay/Puls-Overlay.apk
