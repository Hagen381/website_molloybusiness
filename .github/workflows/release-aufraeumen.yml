# Einmalig: altes Puls-Overlay-Release samt Tag löschen (App liegt jetzt in Hagen381/android-apps).
name: Altes Puls-Overlay-Release entfernen
on:
  push:
    paths: [".github/workflows/release-aufraeumen.yml"]
permissions:
  contents: write
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - run: gh release delete puls-overlay-latest --cleanup-tag --yes --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
